name: Validate plugin

# This repository is generated from tedix-hq/tedix (plugins/tedix) by
# `bun run --cwd packages/cli plugin:repo`; edit it there. This check runs on
# the published tree so a bad release cannot stay installable unnoticed.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - run: node .github/scripts/validate.mjs .
