<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'"
		/>
		<title>Set up this Mac</title>
		<link rel="stylesheet" href="ui.css" />
		<style>
			/*
			 * The whole window is the screen: no rail, no panels. Two shapes,
			 * a centred mark with a headline and a headline beside a plain
			 * list of rows, over one soft glow.
			 */
			@media (prefers-color-scheme: dark) {
				:root {
					--glow-strength: 13%;
					--background: #08080a;
				}
			}
			body {
				display: grid;
				grid-template-rows: 1fr auto;
				overflow: hidden;
				font-size: 14px;
				background:
					radial-gradient(
						560px 380px at var(--glow, 50% 40%),
						color-mix(
							in srgb,
							var(--primary) var(--glow-strength, 7%),
							transparent
						),
						transparent 72%
					),
					var(--background);
			}
			body:has(.split) {
				--glow: 18% 46%;
			}
			.drag {
				position: fixed;
				inset: 0 0 auto 0;
				height: 44px;
				-webkit-app-region: drag;
			}
			main {
				min-height: 0;
				padding: 56px 56px 0;
				display: grid;
			}
			h1 {
				margin: 0;
				font-weight: 500;
				letter-spacing: -0.02em;
				line-height: 1.15;
			}
			.pill {
				justify-self: start;
				display: inline-flex;
				align-items: center;
				height: 24px;
				padding: 0 10px;
				border-radius: 12px;
				background: var(--primary-soft);
				color: var(--primary);
				font-size: 12px;
				font-weight: 550;
			}

			/* Shape A: centred. */
			.centre {
				align-self: center;
				justify-self: center;
				display: grid;
				justify-items: center;
				text-align: center;
				gap: 12px;
				padding-bottom: 32px;
			}
			.centre .mark {
				margin-bottom: 20px;
			}
			.centre .mark img {
				display: block;
				width: 120px;
				height: 120px;
				border-radius: 27px;
				box-shadow: 0 16px 48px rgb(80 40 200 / 28%);
			}
			.centre h1 {
				font-size: 34px;
			}
			.centre p {
				margin: 0;
				color: var(--muted-foreground);
				font-size: 15px;
			}
			.who {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				margin-top: 12px;
				color: var(--muted-foreground);
				font-size: 13px;
			}
			.avatar {
				width: 22px;
				height: 22px;
				border-radius: 50%;
				display: grid;
				place-items: center;
				background: var(--primary-soft);
				color: var(--primary);
				font-size: 11.5px;
				font-weight: 600;
			}
			.check {
				width: 120px;
				height: 120px;
				border-radius: 50%;
				display: grid;
				place-items: center;
				background: var(--good-soft);
				color: var(--good);
			}
			.check path {
				stroke-dasharray: 24;
				animation: draw 400ms 160ms ease-out both;
			}

			/* Shape B: a headline on the left, rows on the right. */
			.split {
				display: grid;
				grid-template-columns: 1fr 2fr;
				gap: 64px;
				min-height: 0;
			}
			.side {
				align-self: center;
				display: grid;
				gap: 16px;
				padding-bottom: 32px;
			}
			.side h1 {
				font-size: 30px;
				text-wrap: balance;
			}
			.side p {
				margin: 0;
				color: var(--muted-foreground);
			}
			.rows {
				align-self: center;
				max-height: 100%;
				overflow-y: auto;
				padding: 0 4px;
			}
			.r {
				display: grid;
				grid-template-columns: 32px 1fr auto;
				column-gap: 16px;
				align-items: center;
				min-height: 80px;
				padding: 16px 0;
			}
			.r + .r {
				border-top: 1px solid var(--border);
			}
			.r .glyph {
				display: grid;
				place-items: center;
				height: 32px;
				color: var(--muted-foreground);
			}
			.r .text {
				min-width: 0;
			}
			.r .title {
				font-weight: 500;
			}
			.r .sub {
				display: flex;
				gap: 8px;
				align-items: baseline;
				color: var(--muted-foreground);
				font-size: 13px;
			}
			.r .sub span {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.r .sub .link {
				flex: none;
				color: var(--faint);
				font-weight: 400;
			}
			.r .sub .link:hover {
				color: var(--foreground);
			}
			#primary:focus-visible {
				outline: 1.5px solid color-mix(in srgb, var(--primary) 45%, transparent);
				outline-offset: 3px;
			}
			.r .control {
				display: flex;
				align-items: center;
			}
			.r label.switch {
				display: block;
				min-height: 0;
				padding: 0;
			}
			.r .below {
				grid-column: 2 / -1;
				margin-top: 12px;
			}
			.r .fail,
			.r .details {
				grid-column: 2 / -1;
				font-size: 12.5px;
				margin-top: 8px;
			}
			.r .fail {
				display: flex;
				gap: 8px;
				align-items: baseline;
				color: color-mix(in srgb, var(--bad) 80%, var(--muted-foreground));
			}
			.r .fail span {
				user-select: text;
				overflow-wrap: anywhere;
			}
			.r .fail .link {
				flex: none;
			}
			.r .details {
				display: grid;
				gap: 4px;
				justify-items: start;
				color: var(--muted-foreground);
				white-space: pre-wrap;
				user-select: text;
				overflow-wrap: anywhere;
			}
			.r .details p {
				margin: 0;
			}
			.done {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				color: var(--muted-foreground);
				font-size: 13px;
			}
			.done svg {
				color: var(--good);
			}
			/* The first screen's two big choices. */
			.choices {
				display: grid;
				grid-template-columns: repeat(2, 240px);
				gap: 12px;
				margin-top: 20px;
			}
			.choice {
				all: unset;
				display: grid;
				gap: 4px;
				padding: 16px;
				border-radius: 12px;
				border: 1px solid var(--border);
				background: var(--card);
				box-shadow: var(--shadow);
				text-align: left;
				cursor: default;
			}
			.choice:hover {
				border-color: var(--primary);
			}
			.choice:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: 2px;
			}
			.choice .title {
				font-weight: 600;
			}
			.choice .sub {
				font-size: 12.5px;
				color: var(--muted-foreground);
			}
			.dash[hidden] {
				display: none;
			}
			.controls {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.rows .sessions {
				padding: 8px 0;
			}
			.none {
				margin: 0;
				padding: 28px 0;
				color: var(--muted-foreground);
			}
			.none + .r {
				border-top: 1px solid var(--border);
			}

			/* The footer: Back, the progress dashes, and one button. */
			footer {
				display: flex;
				align-items: center;
				gap: 12px;
				height: 76px;
				padding: 0 32px;
			}
			footer .space {
				flex: 1;
			}
			.back {
				all: unset;
				width: 28px;
				height: 28px;
				border-radius: 50%;
				display: grid;
				place-items: center;
				color: var(--muted-foreground);
				background: color-mix(in srgb, var(--muted) 70%, transparent);
				transition:
					background 120ms,
					transform 100ms;
			}
			.back[hidden] {
				display: grid;
				visibility: hidden;
			}
			.back:hover {
				background: var(--muted);
				color: var(--foreground);
			}
			.dashes,
			.actions {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.dashes {
				gap: 0;
			}
			.dash {
				all: unset;
				padding: 12px 3px;
			}
			.dash::before {
				content: "";
				display: block;
				width: 14px;
				height: 4px;
				border-radius: 2px;
				background: var(--input);
				transition:
					width 220ms ease,
					background 220ms;
			}
			.dash[aria-current]::before {
				width: 50px;
				background: var(--primary);
			}
			.dash:hover:not([aria-current])::before {
				background: var(--faint);
			}
			.back:focus-visible,
			.dash:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: 2px;
			}
			.actions button.btn {
				height: 36px;
				padding: 0 14px;
				border-radius: 8px;
			}
			button.btn {
				transition:
					background 120ms,
					transform 100ms;
			}
			button.btn:active:not(:disabled),
			.back:active {
				transform: scale(0.96);
			}

			/* A new screen: fade and slide, the left column first, then each row. */
			.in {
				animation: rise 220ms ease-out both;
				animation-delay: calc(var(--i, 0) * 40ms);
			}
			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(12px);
				}
			}
		</style>
	</head>
	<body>
		<div class="drag"></div>
		<main id="screen"></main>
		<footer id="foot"></footer>
		<script src="out/onboarding.js"></script>
	</body>
</html>
