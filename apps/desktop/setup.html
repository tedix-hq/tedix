<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'"
		/>
		<title>Set up this Mac</title>
		<link rel="stylesheet" href="ui.css" />
		<style>
			body {
				display: grid;
				grid-template-columns: 224px 1fr;
				overflow: hidden;
			}
			.drag {
				position: fixed;
				inset: 0 0 auto 0;
				height: 44px;
				-webkit-app-region: drag;
			}

			/* The step rail. */
			nav {
				background: var(--rail);
				border-right: 1px solid var(--border);
				padding: 56px 12px 16px;
				display: flex;
				flex-direction: column;
				gap: 2px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 8px;
				font-weight: 600;
				margin: 0 8px 16px;
			}
			.brand img {
				width: 24px;
				height: 24px;
				border-radius: 6px;
			}
			nav button {
				all: unset;
				display: grid;
				grid-template-columns: 24px 1fr 16px;
				align-items: center;
				gap: 8px;
				height: 34px;
				padding: 0 8px;
				border-radius: var(--radius-small);
				color: var(--muted-foreground);
				font-size: 13px;
				transition:
					background 120ms,
					color 120ms;
			}
			nav button:hover {
				background: color-mix(in srgb, var(--muted) 60%, transparent);
				color: var(--foreground);
			}
			nav button:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: -2px;
			}
			nav button[aria-current="step"] {
				background: var(--card);
				box-shadow:
					var(--shadow),
					0 0 0 1px var(--border);
				color: var(--foreground);
				font-weight: 550;
			}
			nav button[aria-current="step"] .glyph {
				color: var(--primary);
			}
			nav .glyph {
				display: grid;
				place-items: center;
			}
			nav .status {
				display: grid;
				place-items: center;
			}
			nav .status.done {
				color: var(--good);
			}
			nav .status.attention::after {
				content: "";
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--warn);
			}
			nav .foot {
				margin: auto 8px 0;
				font-size: 11.5px;
				color: var(--faint);
			}

			/* One screen. */
			main {
				display: grid;
				grid-template-rows: auto 1fr auto;
				min-height: 0;
				padding: 52px 32px 16px;
			}
			.eyebrow {
				font-size: 11.5px;
				font-weight: 600;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--faint);
				margin-bottom: 4px;
			}
			h1 {
				font-size: 22px;
				line-height: 1.2;
				font-weight: 650;
				letter-spacing: -0.015em;
				margin: 0 0 8px;
			}
			.lead {
				color: var(--muted-foreground);
				margin: 0 0 16px;
				max-width: 60ch;
			}
			.content {
				overflow-y: auto;
				min-height: 0;
				margin: 0 -8px;
				padding: 2px 8px 8px;
			}
			.enter {
				animation: enter 180ms ease-out;
			}
			.enter.back {
				animation-name: enter-back;
			}
			@keyframes enter {
				from {
					opacity: 0;
					transform: translateX(10px);
				}
			}
			@keyframes enter-back {
				from {
					opacity: 0;
					transform: translateX(-10px);
				}
			}
			footer {
				display: flex;
				align-items: center;
				gap: 8px;
				padding-top: 12px;
				border-top: 1px solid var(--border);
			}
			footer .space {
				flex: 1;
			}

			/* Welcome. */
			.hero {
				display: grid;
				justify-items: center;
				text-align: center;
				gap: 8px;
				padding: 8px 0 24px;
			}
			.hero img {
				width: 88px;
				height: 88px;
				border-radius: 20px;
				box-shadow: 0 10px 30px rgb(80 40 200 / 22%);
				margin-bottom: 8px;
			}
			.hero.compact {
				padding: 0 0 16px;
				gap: 4px;
			}
			.hero.compact img {
				width: 56px;
				height: 56px;
				border-radius: 13px;
			}
			.hero h1 {
				font-size: 26px;
				margin: 0;
			}
			.hero p {
				margin: 0;
				color: var(--muted-foreground);
				max-width: 46ch;
			}
			.chip {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				height: 24px;
				padding: 0 10px;
				border-radius: 12px;
				background: var(--muted);
				color: var(--muted-foreground);
				font-size: 12px;
				margin-top: 4px;
			}
			.chip.good {
				background: var(--good-soft);
				color: var(--good);
			}
			ul.points {
				list-style: none;
				margin: 0 auto;
				padding: 0;
				display: grid;
				gap: 12px;
				max-width: 440px;
			}
			ul.points li {
				display: grid;
				grid-template-columns: 36px 1fr;
				gap: 12px;
				align-items: center;
			}
			ul.points .tile {
				background: var(--primary-soft);
				color: var(--primary);
			}
			ul.points b {
				font-weight: 550;
			}
			ul.points small {
				display: block;
			}

			/* The summary table. */
			table.summary,
			table.summary tbody {
				display: block;
			}
			table.summary tr {
				display: grid;
				grid-template-columns: 148px 1fr auto;
				align-items: center;
				gap: 12px;
				min-height: 40px;
				padding: 6px 12px;
				border-top: 1px solid var(--border);
			}
			table.summary tr:first-child {
				border-top: 0;
			}
			table.summary td {
				padding: 0;
			}
			table.summary td.what {
				font-weight: 500;
			}
			table.summary td.detail {
				color: var(--muted-foreground);
				font-size: 12.5px;
			}
			table.summary td.end {
				display: flex;
				align-items: center;
				gap: 12px;
				white-space: nowrap;
			}
			.pill {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				height: 22px;
				padding: 0 8px 0 6px;
				border-radius: 11px;
				font-size: 12px;
				font-weight: 500;
				background: var(--muted);
				color: var(--muted-foreground);
			}
			.pill.done {
				background: var(--good-soft);
				color: var(--good);
			}
			.pill.attention {
				background: var(--warn-soft);
				color: var(--warn);
			}
			.section {
				font-size: 11.5px;
				font-weight: 600;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--faint);
				margin: 16px 4px 8px;
			}
			.section:first-child {
				margin-top: 0;
			}
		</style>
	</head>
	<body>
		<div class="drag"></div>
		<nav id="rail" aria-label="Setup steps"></nav>
		<main id="screen"></main>
		<script src="out/onboarding.js"></script>
	</body>
</html>
