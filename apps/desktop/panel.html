<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
		/>
		<title>This Mac</title>
		<link rel="stylesheet" href="ui.css" />
		<style>
			body {
				padding: 16px;
				overflow-y: auto;
			}
			.head {
				display: grid;
				grid-template-columns: 36px 1fr;
				gap: 12px;
				align-items: center;
				margin-bottom: 16px;
			}
			.head .name {
				font-size: 15px;
			}
			.facts {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 8px;
				margin-bottom: 16px;
			}
			.fact {
				border: 1px solid var(--border);
				border-radius: var(--radius);
				background: var(--card);
				box-shadow: var(--shadow);
				padding: 8px 12px;
			}
			.fact b {
				display: block;
				font-size: 18px;
				font-weight: 650;
				letter-spacing: -0.01em;
			}
			.fact small {
				display: block;
			}
			.section {
				font-size: 11.5px;
				font-weight: 600;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--faint);
				margin: 16px 4px 8px;
			}
			input[type="text"] {
				width: 100%;
				height: 30px;
				padding: 0 8px;
				border-radius: var(--radius-small);
				border: 1px solid var(--input);
				background: var(--background);
				color: var(--foreground);
				font: inherit;
				user-select: text;
			}
			.field {
				display: grid;
				gap: 4px;
				padding: 12px;
				border-bottom: 1px solid var(--border);
			}
			.field span {
				font-weight: 500;
			}
			.notes {
				display: grid;
				gap: 4px;
				margin: 8px 4px 0;
			}
			.buttons {
				display: flex;
				gap: 8px;
				margin-top: 16px;
			}
		</style>
	</head>
	<body>
		<div id="panel"></div>
		<script src="out/panel.js"></script>
	</body>
</html>
