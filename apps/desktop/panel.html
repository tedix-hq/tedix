<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
		/>
		<title>This Mac</title>
		<link rel="stylesheet" href="ui.css" />
		<style>
			body {
				padding: 16px;
				overflow-y: auto;
			}
			.head {
				display: grid;
				grid-template-columns: 36px 1fr;
				gap: 12px;
				align-items: center;
				margin-bottom: 16px;
			}
			.head .name {
				font-size: 15px;
			}
			.line {
				display: flex;
				justify-content: space-between;
				gap: 12px;
				padding: 10px 12px;
			}
			.line + .line {
				border-top: 1px solid var(--border);
			}
			.line span {
				color: var(--muted-foreground);
			}
			.line b {
				font-weight: 500;
			}
			.line.task {
				all: unset;
				display: flex;
				justify-content: space-between;
				gap: 12px;
				padding: 10px 12px;
				width: 100%;
				box-sizing: border-box;
				cursor: pointer;
			}
			.line.task + .line.task {
				border-top: 1px solid var(--border);
			}
			.line.task b {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.line.task span {
				flex: none;
			}
			.line.task:hover b {
				text-decoration: underline;
			}
			.line.task:focus-visible {
				outline: 2px solid var(--ring, currentColor);
				outline-offset: -2px;
			}
			.section {
				font-size: 11.5px;
				font-weight: 600;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--faint);
				margin: 16px 4px 8px;
			}
			input[type="text"] {
				width: 100%;
				height: 30px;
				padding: 0 8px;
				border-radius: var(--radius-small);
				border: 1px solid var(--input);
				background: var(--background);
				color: var(--foreground);
				font: inherit;
				user-select: text;
			}
			.field {
				display: grid;
				gap: 4px;
				padding: 12px;
				border-bottom: 1px solid var(--border);
			}
			.field span {
				font-weight: 500;
			}
			.notes {
				display: grid;
				gap: 4px;
				margin: 8px 4px 0;
			}
			.buttons {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				margin-top: 16px;
			}
		</style>
	</head>
	<body>
		<div id="panel"></div>
		<script src="out/panel.js"></script>
	</body>
</html>
