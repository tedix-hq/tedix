<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'"
		/>
		<title>Updating Tedix</title>
		<link rel="stylesheet" href="ui.css" />
		<style>
			body {
				padding: 20px;
				display: grid;
				grid-template-columns: 56px 1fr;
				gap: 16px;
				align-items: start;
			}
			img {
				width: 56px;
				height: 56px;
			}
			main {
				display: grid;
				gap: 8px;
			}
			h1 {
				margin: 0;
				font-size: 13.5px;
				font-weight: 600;
			}
			progress {
				width: 100%;
				height: 8px;
				accent-color: var(--primary);
			}
			.foot {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 12px;
				margin-top: 4px;
			}
		</style>
	</head>
	<body>
		<img src="assets/icon.png" alt="" />
		<main>
			<h1 id="title">Downloading update…</h1>
			<progress id="bar" aria-labelledby="title"></progress>
			<div class="foot">
				<small id="amount" role="status"></small>
				<button id="cancel" class="btn" type="button">Cancel</button>
			</div>
		</main>
		<script src="out/download-window.js"></script>
	</body>
</html>
