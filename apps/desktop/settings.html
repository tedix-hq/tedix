<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'"
		/>
		<title>Settings</title>
		<link rel="stylesheet" href="ui.css" />
		<style>
			/*
			 * Settings as a panel over the Tedix page, the way chat apps show
			 * theirs: a title bar with a close button, a sidebar with search and
			 * the sections in groups, and on the right one section at a time,
			 * its rows split by hairlines with the control on the right.
			 */
			html,
			body {
				background: transparent;
				overflow: hidden;
				font-size: 14px;
			}
			.backdrop {
				position: fixed;
				inset: 0;
				background: rgb(0 0 0 / 32%);
				animation: fade 180ms ease-out;
			}
			/* The window can still be moved by its top edge. */
			.drag {
				position: fixed;
				inset: 0 0 auto 0;
				height: 40px;
				-webkit-app-region: drag;
			}
			.dialog {
				position: fixed;
				left: 50%;
				top: max(48px, calc(50% - 380px));
				width: min(1040px, calc(100vw - 32px));
				height: min(760px, calc(100vh - 64px));
				transform: translateX(-50%);
				display: grid;
				grid-template-rows: auto 1fr;
				background: var(--background);
				border: 1px solid var(--border);
				border-radius: 16px;
				box-shadow:
					0 24px 64px rgb(0 0 0 / 22%),
					0 2px 8px rgb(0 0 0 / 8%);
				overflow: hidden;
				animation: rise 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
			}
			.dialog > header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				height: 56px;
				padding: 0 12px 0 24px;
				border-bottom: 1px solid var(--border);
			}
			.dialog > header h2 {
				margin: 0;
				font-size: 15px;
				font-weight: 600;
			}
			.iconbtn {
				all: unset;
				width: 32px;
				height: 32px;
				border-radius: 8px;
				display: grid;
				place-items: center;
				color: var(--muted-foreground);
				transition:
					background 140ms,
					color 140ms;
			}
			.iconbtn:hover {
				background: var(--hover);
				color: var(--foreground);
			}
			.iconbtn:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: -2px;
			}
			.body {
				display: grid;
				grid-template-columns: 232px 1fr;
				min-height: 0;
			}
			aside {
				display: grid;
				grid-template-rows: auto 1fr auto;
				gap: 12px;
				padding: 16px 12px 12px;
				border-right: 1px solid var(--border);
				background: var(--rail);
				min-height: 0;
			}
			.searchbox {
				position: relative;
				display: flex;
				align-items: center;
			}
			.searchbox .icon {
				position: absolute;
				left: 10px;
				color: var(--faint);
				pointer-events: none;
			}
			.searchbox input.search {
				width: 100%;
				height: 34px;
				padding-left: 34px;
				border-radius: 9px;
				border-color: transparent;
				background: var(--muted);
				font-size: 14px;
			}
			.searchbox input.search:focus {
				background: var(--card);
				border-color: var(--primary);
			}
			nav {
				display: grid;
				align-content: start;
				gap: 2px;
				overflow-y: auto;
			}
			nav hr {
				border: 0;
				border-top: 1px solid var(--border);
				margin: 8px 12px;
			}
			.navitem {
				all: unset;
				display: flex;
				align-items: center;
				gap: 12px;
				height: 36px;
				padding: 0 12px;
				border-radius: 9px;
				color: var(--foreground);
				transition:
					background 140ms,
					opacity 140ms;
			}
			.navitem .icon {
				color: var(--muted-foreground);
			}
			.navitem:hover {
				background: var(--hover);
			}
			.navitem[aria-current="page"] {
				background: var(--selected);
			}
			.navitem[aria-current="page"] .icon {
				color: var(--foreground);
			}
			.navitem.dim {
				opacity: 0.4;
			}
			.navitem:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: -2px;
			}
			.navitem span:first-of-type {
				flex: 1;
			}
			.dot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--warn);
			}
			/* The account sits at the foot of the sidebar. */
			.who,
			button.who {
				display: grid;
				grid-template-columns: 32px 1fr;
				align-items: center;
				gap: 10px;
				padding: 8px;
				border-radius: 10px;
			}
			button.who {
				all: unset;
				display: grid;
				grid-template-columns: 32px 1fr;
				align-items: center;
				gap: 10px;
				padding: 8px;
				border-radius: 10px;
				transition: background 140ms;
			}
			button.who:hover {
				background: var(--hover);
			}
			button.who .title {
				color: var(--primary);
			}
			.who .avatar {
				width: 32px;
				height: 32px;
				border-radius: 50%;
				display: grid;
				place-items: center;
				background: var(--primary-soft);
				color: var(--primary);
				font-size: 13px;
				font-weight: 600;
			}
			.who .text {
				min-width: 0;
			}
			.who .title,
			.who .sub {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.who .title {
				font-size: 13.5px;
				font-weight: 500;
			}
			.who .sub {
				font-size: 12px;
				color: var(--muted-foreground);
			}
			main {
				overflow-y: auto;
				min-width: 0;
				padding: 24px 32px 40px;
			}
			#page {
				max-width: 720px;
				margin: 0 auto;
				display: grid;
				gap: 28px;
			}
			#page.enter {
				animation: enter 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
			}
			h1 {
				margin: 0 0 -12px;
				font-size: 17px;
				font-weight: 600;
				letter-spacing: -0.01em;
			}
			.heading {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				padding-bottom: 4px;
				font-size: 14px;
				font-weight: 600;
			}
			.heading .column {
				font-size: 12px;
				font-weight: 500;
				color: var(--muted-foreground);
			}
			/* Rows: label and one muted line on the left, the control on the right. */
			.group {
				border: 0;
				border-radius: 0;
				background: none;
				box-shadow: none;
			}
			.item {
				column-gap: 14px;
				min-height: 64px;
				padding: 14px 0;
			}
			.item + .item {
				border-top: 1px solid var(--border);
			}
			/* A group without a heading continues the one above it, split by a
			   hairline like any other row instead of an empty gap. */
			#page > section + section:not(:has(> .heading)) {
				margin-top: -28px;
			}
			#page > section + section:not(:has(> .heading)) > .group:not(:empty) {
				border-top: 1px solid var(--border);
			}
			.item .title {
				font-size: 14px;
				font-weight: 450;
			}
			.item .sub {
				margin-top: 2px;
				font-size: 13px;
			}
			.item .control .btn,
			input.field {
				height: 32px;
				padding: 0 14px;
				border-radius: 9px;
				font-size: 13.5px;
			}
			input.field {
				width: 240px;
				padding: 0 10px;
			}
			.item .control .btn:not(.primary):not(.quiet) {
				background: var(--muted);
				border-color: transparent;
				box-shadow: none;
			}
			.item .control .btn:not(.primary):not(.quiet):hover:not(:disabled) {
				background: var(--selected);
			}
			.segmented {
				padding: 3px;
				border-radius: 10px;
			}
			.segmented .seg {
				height: 26px;
				padding: 0 12px;
				border-radius: 7px;
				font-size: 13px;
				transition:
					background 140ms,
					color 140ms;
			}
			.sessions .group {
				border: 1px solid var(--border);
				border-radius: 12px;
			}
			.empty {
				padding: 48px 0;
				text-align: center;
			}
			.done {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				color: var(--good);
				font-size: 13px;
				font-weight: 500;
			}
			.control label.switch {
				display: inline-flex;
				min-height: 0;
				padding: 0;
			}
			.sessions .bar input.search {
				height: 32px;
				border-radius: 9px;
			}
			.sessions .item {
				min-height: 56px;
				padding: 10px 16px;
			}
			/* A text-only button ends where the row's hairline ends. */
			.item .control .btn.quiet:last-child {
				margin-right: -14px;
			}
			kbd {
				height: 22px;
				min-width: 22px;
				font-size: 12px;
				border: 1px solid var(--border);
				background: var(--muted);
			}
			@keyframes fade {
				from {
					opacity: 0;
				}
			}
			@keyframes rise {
				from {
					opacity: 0;
					transform: translateX(-50%) translateY(8px) scale(0.985);
				}
			}
			@keyframes enter {
				from {
					opacity: 0;
					transform: translateY(4px);
				}
			}
			/* A narrow window: the sidebar keeps only the icons. */
			@media (max-width: 760px) {
				.body {
					grid-template-columns: 64px 1fr;
				}
				aside {
					padding: 12px 8px;
				}
				.searchbox,
				.navitem span,
				.who .text {
					display: none;
				}
				.navitem {
					justify-content: center;
					padding: 0;
					position: relative;
				}
				.navitem .dot {
					display: block;
					position: absolute;
					top: 7px;
					right: 9px;
				}
				nav hr {
					margin: 8px 4px;
				}
				.who,
				button.who {
					grid-template-columns: 32px;
					justify-content: center;
					padding: 4px 0;
				}
				main {
					padding: 20px 20px 32px;
				}
				input.field {
					width: 180px;
				}
			}
		</style>
	</head>
	<body>
		<div class="backdrop" id="backdrop"></div>
		<div class="drag"></div>
		<div
			class="dialog"
			role="dialog"
			aria-modal="true"
			aria-labelledby="dialog-title"
		>
			<header>
				<h2 id="dialog-title">Settings</h2>
				<button
					id="done"
					class="iconbtn"
					type="button"
					aria-label="Close settings"
				></button>
			</header>
			<div class="body">
				<aside>
					<label class="searchbox">
						<input
							id="search"
							class="search"
							type="search"
							placeholder="Search"
							aria-label="Search settings"
						/>
					</label>
					<nav id="nav" aria-label="Settings sections"></nav>
					<div id="account"></div>
				</aside>
				<main><div id="page"></div></main>
			</div>
		</div>
		<script src="out/settings.js"></script>
	</body>
</html>
