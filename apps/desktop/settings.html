<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'"
		/>
		<title>Settings</title>
		<link rel="stylesheet" href="ui.css" />
		<style>
			/*
			 * One window for every setting: a sidebar with search, the account
			 * and the sections, and grouped cards on the right. Sizes follow
			 * Kumo's small controls: 26px buttons and fields, 22x34 switches,
			 * 13px text, 12px secondary text.
			 */
			body {
				display: grid;
				grid-template-columns: 216px 1fr;
				overflow: hidden;
				font-size: 13px;
			}
			aside {
				background: var(--rail);
				border-right: 1px solid var(--border);
				display: grid;
				grid-template-rows: auto auto 1fr;
				gap: 12px;
				padding: 52px 10px 12px;
				min-height: 0;
				-webkit-app-region: drag;
			}
			aside > * {
				-webkit-app-region: no-drag;
			}
			input.field {
				width: 220px;
			}
			#search {
				width: 100%;
			}
			.who {
				display: grid;
				grid-template-columns: 28px 1fr auto;
				align-items: center;
				gap: 8px;
				padding: 6px;
				border-radius: 8px;
			}
			button.who {
				all: unset;
				display: grid;
				grid-template-columns: 28px 1fr;
				align-items: center;
				gap: 8px;
				padding: 6px;
				border-radius: 8px;
			}
			button.who:hover {
				background: color-mix(in srgb, var(--foreground) 6%, transparent);
			}
			button.who .title {
				color: var(--primary);
			}
			.who .avatar {
				width: 28px;
				height: 28px;
				border-radius: 50%;
				display: grid;
				place-items: center;
				background: var(--primary-soft);
				color: var(--primary);
				font-size: 12px;
				font-weight: 600;
			}
			.who .text {
				min-width: 0;
			}
			.who .title,
			.who .sub {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.who .title {
				font-weight: 550;
			}
			.who .sub {
				font-size: 12px;
				color: var(--muted-foreground);
			}
			nav {
				display: grid;
				align-content: start;
				gap: 2px;
				overflow-y: auto;
			}
			.navitem {
				all: unset;
				display: flex;
				align-items: center;
				gap: 8px;
				height: 28px;
				padding: 0 8px;
				border-radius: 6px;
				color: var(--muted-foreground);
				cursor: default;
			}
			.navitem:hover {
				background: color-mix(in srgb, var(--foreground) 6%, transparent);
			}
			.navitem[aria-current="page"] {
				background: color-mix(in srgb, var(--foreground) 9%, transparent);
				color: var(--foreground);
				font-weight: 500;
			}
			.navitem.dim {
				opacity: 0.45;
			}
			.navitem:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: -2px;
			}
			.navitem span:first-of-type {
				flex: 1;
			}
			.dot {
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--warn);
			}
			main {
				overflow-y: auto;
				padding: 52px 28px 28px;
				min-width: 0;
			}
			#done {
				position: fixed;
				top: 14px;
				right: 16px;
				-webkit-app-region: no-drag;
			}
			.drag {
				position: fixed;
				inset: 0 0 auto 216px;
				height: 36px;
				-webkit-app-region: drag;
			}
			#page {
				max-width: 640px;
				margin: 0 auto;
				display: grid;
				gap: 20px;
			}
			h1 {
				margin: 0;
				font-size: 20px;
				font-weight: 600;
				letter-spacing: -0.01em;
			}
			.heading {
				display: flex;
				justify-content: space-between;
				padding: 0 4px 6px;
				font-size: 12px;
				font-weight: 550;
				color: var(--muted-foreground);
			}
			.checks {
				display: grid;
				gap: 2px;
			}
			.appicon {
				width: 40px;
				height: 40px;
			}
			/* Kumo small controls. */
			button.btn,
			button.btn.primary {
				height: 26px;
				padding: 0 10px;
				font-size: 13px;
				border-radius: 6px;
			}
			label.switch {
				display: inline-flex;
				min-height: 0;
				padding: 0;
			}
			label.switch input {
				width: 34px;
				height: 22px;
			}
			label.switch input:checked::after {
				transform: translateX(12px);
			}
			.done {
				display: inline-flex;
				align-items: center;
				gap: 4px;
				color: var(--good);
				font-size: 12px;
				font-weight: 550;
			}
			kbd {
				height: 22px;
				min-width: 22px;
				font-size: 12px;
				border: 1px solid var(--border);
				background: var(--muted);
			}
		</style>
	</head>
	<body>
		<aside>
			<input
				id="search"
				class="search"
				type="search"
				placeholder="Search settings…"
				aria-label="Search settings"
			/>
			<div id="account"></div>
			<nav id="nav" aria-label="Settings sections"></nav>
		</aside>
		<div class="drag"></div>
		<main><div id="page"></div></main>
		<button id="done" class="btn" type="button">Done</button>
		<script src="out/settings.js"></script>
	</body>
</html>
