<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
		/>
		<title>Update</title>
		<link rel="stylesheet" href="ui.css" />
		<style>
			/*
			 * The entry sits over the Tedix OS page, which can be light while
			 * the Mac is dark, so it takes that page's side with the same
			 * colours as ui.css.
			 */
			:root[data-theme="light"] {
				color-scheme: light;
				--foreground: #18181a;
				--card: #ffffff;
				--muted: #ececee;
				--muted-foreground: #5d5d63;
				--primary: #6d2fe0;
				--border: #e3e3e6;
				--input: #c9c9ce;
				--warn: #8f5d00;
				--warn-soft: #fbefd3;
				--shadow: 0 1px 2px rgb(0 0 0 / 5%);
			}
			:root[data-theme="dark"] {
				color-scheme: dark;
				--foreground: #f4f4f5;
				--card: #151517;
				--muted: #232326;
				--muted-foreground: #a9a9b1;
				--primary: #a78bfa;
				--border: #26262a;
				--input: #45454b;
				--warn: #e8b23a;
				--warn-soft: #2a2110;
				--shadow: none;
			}
			html,
			body {
				height: 100%;
				background: transparent;
				overflow: hidden;
			}
			#update {
				position: absolute;
				left: 0;
				bottom: 0;
				width: max-content;
			}
			#update:is([data-place="sidebar"], [data-place="rail"]) {
				width: 100%;
			}
			.entry {
				height: 32px;
				width: 100%;
				padding: 0 10px;
				border-radius: var(--radius-small);
				border: 1px solid var(--border);
				background: var(--card);
				color: var(--foreground);
				font: inherit;
				font-size: 13px;
				display: flex;
				align-items: center;
				gap: 8px;
				white-space: nowrap;
				text-align: left;
				transition: background 120ms;
			}
			#update[data-place="rail"] .entry {
				padding: 0;
				justify-content: center;
			}
			.entry .text {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.entry .icon-refresh,
			.entry .icon-clock {
				color: var(--primary);
			}
			.entry .icon-arrow {
				color: var(--muted-foreground);
			}
			.entry:focus-visible {
				outline-offset: -2px;
			}
			button.entry:hover {
				background: var(--muted);
			}
			.entry.working {
				color: var(--muted-foreground);
			}
			/* "Updated to …": shown once after the restart, then it fades out. */
			.entry.done {
				color: var(--muted-foreground);
				animation: fade-out 700ms ease 9000ms forwards;
			}
			.entry.done .icon-check {
				color: var(--primary);
			}
			@keyframes fade-out {
				to {
					opacity: 0;
				}
			}
			.entry.warn {
				color: var(--warn);
				background: var(--warn-soft);
				border-color: color-mix(in srgb, var(--warn) 35%, var(--border));
			}
		</style>
	</head>
	<body>
		<div id="update"></div>
		<script src="out/update-button.js"></script>
	</body>
</html>
