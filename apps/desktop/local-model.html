<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"
		/>
		<title>Chat on This Mac</title>
		<link rel="stylesheet" href="ui.css" />
		<style>
			body {
				display: grid;
				grid-template-rows: auto minmax(0, 1fr) auto;
			}
			header,
			footer {
				padding: 16px clamp(16px, 4vw, 36px);
			}
			header {
				border-bottom: 1px solid var(--border);
				display: flex;
				flex-wrap: wrap;
				justify-content: space-between;
				gap: 8px 16px;
				align-items: baseline;
			}
			h1 {
				margin: 0;
				font-size: 20px;
			}
			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				align-items: end;
			}
			details {
				max-width: 100%;
			}
			summary {
				cursor: pointer;
				color: var(--muted-foreground);
			}
			.server {
				display: grid;
				grid-template-columns: minmax(120px, auto) 82px;
				align-items: center;
				gap: 4px 10px;
				margin-block: 8px;
			}
			.server input {
				width: 82px;
			}
			.server span {
				grid-column: 1 / -1;
				color: var(--muted-foreground);
			}
			select,
			input,
			textarea {
				background: var(--card);
				color: var(--foreground);
				border: 1px solid var(--input);
				border-radius: var(--radius-small);
				font: inherit;
				padding: 7px 10px;
			}
			#model {
				flex: 1 1 165px;
				min-width: 0;
				max-width: 100%;
			}
			button {
				min-height: 34px;
				border: 1px solid var(--input);
				border-radius: var(--radius-small);
				background: var(--card);
				color: var(--foreground);
				padding: 4px 12px;
				font: inherit;
			}
			button:disabled {
				opacity: 0.55;
			}
			#send {
				background: var(--primary);
				color: var(--primary-foreground);
				border-color: var(--primary);
			}
			#connection {
				margin: 6px 0 0;
				color: var(--muted-foreground);
			}
			#connection:empty {
				display: none;
			}
			main {
				overflow-y: auto;
				padding: 16px clamp(16px, 4vw, 36px);
			}
			#messages {
				display: grid;
				gap: 16px;
				max-width: 680px;
				margin-inline: auto;
			}
			#empty {
				color: var(--muted-foreground);
				text-align: center;
				margin: 16vh 0 0;
			}
			.turn {
				display: grid;
				gap: 4px;
				overflow-wrap: anywhere;
			}
			.turn.user {
				justify-self: end;
				max-width: 85%;
			}
			.turn.user div {
				background: var(--muted);
				border-radius: var(--radius);
				padding: 8px 12px;
			}
			.turn span {
				color: var(--muted-foreground);
				font-size: 12px;
			}
			.turn div {
				white-space: pre-wrap;
			}
			footer {
				border-top: 1px solid var(--border);
			}
			textarea {
				display: block;
				width: 100%;
				resize: vertical;
				min-height: 65px;
				max-height: 180px;
			}
			.actions {
				margin-top: 8px;
				justify-content: space-between;
				align-items: center;
			}
			#notice {
				color: var(--muted-foreground);
				margin: 8px 0 0;
				min-height: 1.45em;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Chat on This Mac</h1>
			<details>
				<summary>Connections</summary>
				<div class="server">
					<label for="ollama-port">Ollama port</label>
					<input
						id="ollama-port"
						type="number"
						min="1"
						max="65535"
						value="11434"
					/>
					<span id="ollama-status"></span>
				</div>
				<div class="server">
					<label for="lmstudio-port">LM Studio port</label>
					<input
						id="lmstudio-port"
						type="number"
						min="1"
						max="65535"
						value="1234"
					/>
					<span id="lmstudio-status"></span>
				</div>
				<button id="refresh" type="button">Refresh models</button>
			</details>
		</header>
		<main aria-label="Conversation" id="conversation">
			<div id="messages"></div>
			<p id="empty">What would you like to talk about?</p>
		</main>
		<footer>
			<form id="composer">
				<textarea
					id="prompt"
					aria-label="Message"
					maxlength="48000"
					placeholder="Message the local model…"
				></textarea>
				<div class="actions">
					<select id="model" aria-label="Model on this Mac" disabled></select>
					<div>
						<button id="new-chat" type="button">New chat</button>
						<button id="stop" type="button" hidden>Stop</button>
						<button id="send" type="submit" disabled>Send</button>
					</div>
				</div>
				<p id="connection" role="status"></p>
				<p id="notice" role="status"></p>
			</form>
		</footer>
		<script src="out/local-model-chat.js"></script>
	</body>
</html>
