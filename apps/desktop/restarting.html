<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; style-src 'unsafe-inline'"
		/>
		<title>Restarting Tedix</title>
		<style>
			/* Light by default; `#dark` in the address makes it dark, like the page it covers. */
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: grid;
				place-items: center;
				background: #fafafa;
				color: #5d5d63;
				font:
					13px -apple-system,
					BlinkMacSystemFont,
					system-ui,
					sans-serif;
				--track: #c9c9ce;
				--spin: #6d2fe0;
			}
			body:target {
				background: #0b0b0c;
				color: #a9a9b1;
				--track: #45454b;
				--spin: #a78bfa;
			}
			.status {
				display: flex;
				align-items: center;
				gap: 10px;
				animation: show 150ms ease both;
			}
			.spinner {
				width: 14px;
				height: 14px;
				border-radius: 50%;
				border: 2px solid var(--track);
				border-top-color: var(--spin);
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			@keyframes show {
				from {
					opacity: 0;
				}
			}
		</style>
	</head>
	<body id="dark">
		<div class="status" role="status">
			<span class="spinner"></span>
			<span>Restarting Tedix…</span>
		</div>
	</body>
</html>
