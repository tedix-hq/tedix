<!doctype html>
<html lang="en" data-theme="tedix">
	<head>
		<meta charset="UTF-8" />
		<!--
			`viewport-fit=cover` is required, not cosmetic: without it every
			`env(safe-area-inset-*)` resolves to 0 and the notch/home-indicator
			padding in styles.css is silently inert. `interactive-widget=resizes-content`
			asks Chromium to shrink the layout viewport for the software keyboard;
			iOS ignores it, which is what `installViewportMetrics()` is for.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="robots" content="noindex, nofollow, noarchive" />
		<meta
			name="description"
			content="A platform for agents, apps, and work. Keep your team's tasks, project knowledge, apps, decisions, and results together."
		/>
		<title>Tedix OS</title>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Tedix" />
		<meta property="og:title" content="Tedix OS" />
		<meta
			property="og:description"
			content="A platform for agents, apps, and work. Keep your team's tasks, project knowledge, apps, decisions, and results together."
		/>
		<meta
			property="og:image"
			content="https://tedix.dev/images/tedix-preview.jpg"
		/>
		<meta property="og:image:width" content="1024" />
		<meta property="og:image:height" content="512" />
		<meta
			property="og:image:alt"
			content="Tedix: a platform for agents, apps, and work, with a sample engineering decision in Tedix OS."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Tedix OS" />
		<meta
			name="twitter:description"
			content="A platform for agents, apps, and work. Keep your team's tasks, project knowledge, apps, decisions, and results together."
		/>
		<meta
			name="twitter:image"
			content="https://tedix.dev/images/tedix-preview.jpg"
		/>
		<meta
			name="twitter:image:alt"
			content="Tedix: a platform for agents, apps, and work, with a sample engineering decision in Tedix OS."
		/>
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta
			name="theme-color"
			content="#fbfbfb"
			media="(prefers-color-scheme: light)"
		/>
		<meta
			name="theme-color"
			content="#030303"
			media="(prefers-color-scheme: dark)"
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Tedix" />
		<!-- Pre-paint theme init: mirrors src/lib/theme.ts (storage key + attribute contract). -->
		<script>
			(function () {
				try {
					var d = document.documentElement;
					var t = localStorage.getItem("tedix-os-theme");
					var m =
						t === "light" || t === "dark"
							? t
							: matchMedia("(prefers-color-scheme:dark)").matches
								? "dark"
								: "light";
					d.dataset.theme = "tedix";
					d.dataset.mode = m;
					d.classList.toggle("dark", m === "dark");
					var raw = localStorage.getItem("tedix-os-organization-theme");
					if (raw) {
						var cached = JSON.parse(raw);
						var values = cached && cached.version === 1 && cached[m];
						var allowed = [
							"--background",
							"--foreground",
							"--background-lighter",
							"--background-base",
							"--card",
							"--card-foreground",
							"--popover",
							"--popover-foreground",
							"--primary",
							"--primary-foreground",
							"--secondary",
							"--secondary-foreground",
							"--muted",
							"--muted-foreground",
							"--accent",
							"--accent-foreground",
							"--border",
							"--input",
							"--ring",
							"--font-sans",
							"--font-mono",
						];
						if (values) {
							allowed.forEach(function (property) {
								if (typeof values[property] === "string")
									d.style.setProperty(property, values[property]);
							});
							d.dataset.tenantTheme = "custom";
						}
					}
				} catch (e) {}
			})();
		</script>
		<!--
			Document-scoped, not React-scoped: the visual-viewport listener outlives
			every route and must not be torn down and re-installed by StrictMode's
			double-invoked effects. `styles.css` ships the pre-JS defaults, so the
			shell is correctly sized before this runs.
		-->
		<script type="module" src="/src/init-viewport.ts"></script>
	</head>
	<body>
		<div id="root">
			<div
				role="status"
				aria-busy="true"
				style="
					padding: clamp(1.5rem, 6vw, 5rem);
					font-family: var(--font-mono, monospace);
					color: var(--foreground, CanvasText);
					background: var(--background, Canvas);
					min-height: 100dvh;
				"
			>
				<strong>Tedix</strong>
				<p>Opening your workspace…</p>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
