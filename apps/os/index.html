<!doctype html>
<html lang="en" data-theme="tedix">
	<head>
		<meta charset="UTF-8" />
		<!--
			`viewport-fit=cover` is required, not cosmetic: without it every
			`env(safe-area-inset-*)` resolves to 0 and the notch/home-indicator
			padding in styles.css is silently inert. `interactive-widget=resizes-content`
			asks Chromium to shrink the layout viewport for the software keyboard;
			iOS ignores it, which is what `installViewportMetrics()` is for.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="robots" content="noindex, nofollow, noarchive" />
		<meta
			name="description"
			content="A platform for agents, apps, and work. Keep your team's tasks, project knowledge, apps, decisions, and results together."
		/>
		<title>Tedix OS</title>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Tedix" />
		<meta property="og:title" content="Tedix OS" />
		<meta
			property="og:description"
			content="A platform for agents, apps, and work. Keep your team's tasks, project knowledge, apps, decisions, and results together."
		/>
		<meta
			property="og:image"
			content="https://tedix.dev/images/tedix-preview.jpg"
		/>
		<meta property="og:image:width" content="1024" />
		<meta property="og:image:height" content="512" />
		<meta
			property="og:image:alt"
			content="Tedix: a platform for agents, apps, and work, with a sample engineering decision in Tedix OS."
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Tedix OS" />
		<meta
			name="twitter:description"
			content="A platform for agents, apps, and work. Keep your team's tasks, project knowledge, apps, decisions, and results together."
		/>
		<meta
			name="twitter:image"
			content="https://tedix.dev/images/tedix-preview.jpg"
		/>
		<meta
			name="twitter:image:alt"
			content="Tedix: a platform for agents, apps, and work, with a sample engineering decision in Tedix OS."
		/>
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta
			name="theme-color"
			content="#fbfbfb"
			media="(prefers-color-scheme: light)"
		/>
		<meta
			name="theme-color"
			content="#030303"
			media="(prefers-color-scheme: dark)"
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Tedix" />
		<!-- Pre-paint theme init: mirrors src/lib/theme.ts (storage key + attribute contract). -->
		<script>
			(function () {
				try {
					var d = document.documentElement;
					var t = localStorage.getItem("tedix-os-theme");
					var m =
						t === "light" || t === "dark"
							? t
							: matchMedia("(prefers-color-scheme:dark)").matches
								? "dark"
								: "light";
					d.dataset.theme = "tedix";
					d.dataset.mode = m;
					d.classList.toggle("dark", m === "dark");
					var raw = localStorage.getItem("tedix-os-organization-theme");
					if (raw) {
						var cached = JSON.parse(raw);
						var values = cached && cached.version === 1 && cached[m];
						var allowed = [
							"--background",
							"--foreground",
							"--background-lighter",
							"--background-base",
							"--card",
							"--card-foreground",
							"--popover",
							"--popover-foreground",
							"--primary",
							"--primary-foreground",
							"--secondary",
							"--secondary-foreground",
							"--muted",
							"--muted-foreground",
							"--accent",
							"--accent-foreground",
							"--border",
							"--input",
							"--ring",
							"--font-sans",
							"--font-mono",
						];
						if (values) {
							allowed.forEach(function (property) {
								if (typeof values[property] === "string")
									d.style.setProperty(property, values[property]);
							});
							d.dataset.tenantTheme = "custom";
						}
					}
				} catch (e) {}
			})();
		</script>
		<!--
			Document-scoped, not React-scoped: the visual-viewport listener outlives
			every route and must not be torn down and re-installed by StrictMode's
			double-invoked effects. `styles.css` ships the pre-JS defaults, so the
			shell is correctly sized before this runs.
		-->
		<script type="module" src="/src/init-viewport.ts"></script>
	</head>
	<body>
		<div id="root">
			<div
				role="status"
				aria-busy="true"
				style="
					padding: clamp(1.5rem, 6vw, 5rem);
					font-family: var(--font-mono, monospace);
					color: var(--foreground, CanvasText);
					background: var(--background, Canvas);
					min-height: 100dvh;
				"
			>
				<strong>Tedix</strong>
				<p>Opening your workspace…</p>
			</div>
		</div>
		<script>
			(function () {
				try {
					var match = location.pathname.match(
						/^\/workspace\/([0-9a-f-]{36})$/i,
					);
					var search = new URLSearchParams(location.search);
					if (
						!match ||
						search.get("pane") !== "chat" ||
						search.has("workpiece") ||
						!matchMedia("(max-width: 959px)").matches
					)
						return;
					var workspaceId = match[1];
					var conversation = search.get("conversation") || "new";
					var draftKey =
						"tedix.workspace-chat.draft." + workspaceId + "." + conversation;
					var pendingKey = "tedix.workspace-chat.pending." + workspaceId;
					var root = document.getElementById("root");
					if (!root) return;
					root.innerHTML =
						'<main style="display:flex;min-height:100dvh;flex-direction:column;background:var(--background,Canvas);color:var(--foreground,CanvasText);font-family:var(--font-sans,system-ui)">' +
						'<header style="padding:1rem;border-bottom:1px solid var(--border,ButtonBorder)"><strong>Tedix</strong><div style="margin-top:.25rem">Opening your workspace…</div></header>' +
						'<div style="flex:1"></div><form id="phone-chat-bootstrap" style="padding:1rem;border-top:1px solid var(--border,ButtonBorder)">' +
						'<label for="phone-chat-draft" style="display:block;font-weight:600;margin-bottom:.5rem">Workspace chat</label>' +
						'<textarea id="phone-chat-draft" aria-label="Message the workspace" placeholder="Ask this workspace…" rows="2" style="box-sizing:border-box;width:100%;min-height:4.5rem;padding:.75rem;border:1px solid var(--input,ButtonBorder);border-radius:.75rem;background:var(--card,Field);color:inherit;font:inherit;resize:none"></textarea>' +
						'<div style="display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-top:.5rem"><span id="phone-chat-status" role="status" style="font-size:.875rem"></span><button type="submit" style="min-height:2.75rem;padding:.5rem 1rem;border:0;border-radius:.65rem;background:var(--primary,#2563eb);color:var(--primary-foreground,#fff);font:inherit;font-weight:600">Send</button></div>' +
						"</form></main>";
					var form = document.getElementById("phone-chat-bootstrap");
					var textarea = document.getElementById("phone-chat-draft");
					var status = document.getElementById("phone-chat-status");
					textarea.value = localStorage.getItem(draftKey) || "";
					textarea.addEventListener("input", function () {
						localStorage.setItem(draftKey, textarea.value);
					});
					form.addEventListener("submit", function (event) {
						event.preventDefault();
						var text = textarea.value.trim();
						if (!text) return;
						sessionStorage.setItem(
							pendingKey,
							JSON.stringify({ conversation: conversation, text: text }),
						);
						localStorage.setItem(draftKey, "");
						textarea.value = "";
						status.textContent = "Sending when the workspace is ready…";
					});
					textarea.focus();
				} catch (error) {
					console.error("Phone chat bootstrap failed", error);
				}
			})();
		</script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
