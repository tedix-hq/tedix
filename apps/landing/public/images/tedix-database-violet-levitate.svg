<svg viewBox="0 0 520 520" width="520" height="520" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Tedix database</title>
  <defs>
    <!-- Layer 0 gradients -->
    <linearGradient id="lyr0-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f0abfc"/>
      <stop offset="55%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="lyr0-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="lyr0-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#581c87"/>
      <stop offset="100%" stop-color="#0c0a25"/>
    </linearGradient>
    <!-- Layer 1 gradients -->
    <linearGradient id="lyr1-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f0abfc"/>
      <stop offset="55%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="lyr1-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="lyr1-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#581c87"/>
      <stop offset="100%" stop-color="#0c0a25"/>
    </linearGradient>
    <!-- Layer 2 gradients -->
    <linearGradient id="lyr2-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f0abfc"/>
      <stop offset="55%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="lyr2-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="lyr2-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#581c87"/>
      <stop offset="100%" stop-color="#0c0a25"/>
    </linearGradient>
    <!-- Glow halo -->
    <radialGradient id="glow-bg" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <!-- Floor shadow filter -->
    <filter id="softblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Glow halo behind the stack -->
  <rect x="40" y="120" width="440" height="380" fill="url(#glow-bg)"/>

  <!-- Floor shadow -->
  <ellipse class="floor-shadow" cx="260" cy="419" rx="160" ry="18"
           fill="#000" opacity="0.28" filter="url(#softblur)"/>

  <!-- Layer 0 — bottom (cy=324) -->
  <g class="layer anim-levitate-0" style="transform-origin:260px 324px;transform-box:fill-box">
    <polygon points="390,324 260,389 260,413 390,348"
             fill="url(#lyr0-right)" stroke="url(#lyr0-right)"
             stroke-width="14" stroke-linejoin="round"/>
    <polygon points="130,324 260,389 260,413 130,348"
             fill="url(#lyr0-left)" stroke="url(#lyr0-left)"
             stroke-width="14" stroke-linejoin="round"/>
    <polygon points="260,259 390,324 260,389 130,324"
             fill="url(#lyr0-top)" stroke="url(#lyr0-top)"
             stroke-width="14" stroke-linejoin="round"/>
    <polyline points="130,324 260,259 390,324"
              fill="none" stroke="#c084fc" stroke-opacity="0.55"
              stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Layer 1 — middle (cy=268) -->
  <g class="layer anim-levitate-1" style="transform-origin:260px 268px;transform-box:fill-box">
    <polygon points="390,268 260,333 260,357 390,292"
             fill="url(#lyr1-right)" stroke="url(#lyr1-right)"
             stroke-width="14" stroke-linejoin="round"/>
    <polygon points="130,268 260,333 260,357 130,292"
             fill="url(#lyr1-left)" stroke="url(#lyr1-left)"
             stroke-width="14" stroke-linejoin="round"/>
    <polygon points="260,203 390,268 260,333 130,268"
             fill="url(#lyr1-top)" stroke="url(#lyr1-top)"
             stroke-width="14" stroke-linejoin="round"/>
    <polyline points="130,268 260,203 390,268"
              fill="none" stroke="#c084fc" stroke-opacity="0.55"
              stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Layer 2 — top (cy=212) -->
  <g class="layer anim-levitate-2" style="transform-origin:260px 212px;transform-box:fill-box">
    <polygon points="390,212 260,277 260,301 390,236"
             fill="url(#lyr2-right)" stroke="url(#lyr2-right)"
             stroke-width="14" stroke-linejoin="round"/>
    <polygon points="130,212 260,277 260,301 130,236"
             fill="url(#lyr2-left)" stroke="url(#lyr2-left)"
             stroke-width="14" stroke-linejoin="round"/>
    <polygon points="260,147 390,212 260,277 130,212"
             fill="url(#lyr2-top)" stroke="url(#lyr2-top)"
             stroke-width="14" stroke-linejoin="round"/>
    <polyline points="130,212 260,147 390,212"
              fill="none" stroke="#c084fc" stroke-opacity="0.55"
              stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <style>
    .layer { transform-box: fill-box; }
    .floor-shadow { transform-box: fill-box; transform-origin: 260px 419px; }
    @keyframes lev {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
    @keyframes shadow-lev {
      0%, 100% { transform: scale(1);    opacity: 0.28; }
      50%       { transform: scale(0.88); opacity: 0.196; }
    }
    .floor-shadow    { animation: shadow-lev 3.60s ease-in-out infinite; }
    .anim-levitate-0 { animation: lev 3.60s ease-in-out infinite; animation-delay: 0.00s; }
    .anim-levitate-1 { animation: lev 3.60s ease-in-out infinite; animation-delay: 0.18s; }
    .anim-levitate-2 { animation: lev 3.60s ease-in-out infinite; animation-delay: 0.36s; }
    @media (prefers-reduced-motion: reduce) {
      .layer, .floor-shadow { animation: none !important; }
    }
  </style>
</svg>
