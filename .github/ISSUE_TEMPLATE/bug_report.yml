name: Bug report
description: Report a reproducible problem in Tedix
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include secrets, tokens, tenant data, or production dumps.
        Security vulnerabilities go through SECURITY.md, never a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant logs or screenshots.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Tedix Cloud
        - Local demo (bun run-local)
        - Self-hosted Cloudflare account
        - Tedix CLI
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Build or source revision
      description: Cloud build, CLI version (`tedix --version`), or commit sha.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App or package, browser or runtime, OS.
