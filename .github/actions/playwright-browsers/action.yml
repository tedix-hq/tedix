name: Install Playwright browsers
description: Restore the browsers for the lockfile-pinned Playwright from the cache, then install only the requested ones and their OS packages

inputs:
  browsers:
    description: Space-separated Playwright browser names, for example "chromium webkit"
    required: true

runs:
  using: composite
  steps:
    - name: Resolve the installed Playwright version
      id: playwright
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        version="$(bun run --cwd apps/os playwright --version | sed -n 's/^Version //p')"
        test -n "$version"
        echo "key=playwright-${RUNNER_OS}-${RUNNER_ARCH}-${version}-${BROWSERS// /-}" >> "$GITHUB_OUTPUT"
        # Several runner images are in service at once; the image version
        # comes last so a new image restores another image's packages.
        apt_prefix="playwright-apt-${ImageOS:-unknown}-${version}-${BROWSERS// /-}@"
        echo "apt-prefix=${apt_prefix}" >> "$GITHUB_OUTPUT"
        echo "apt-key=${apt_prefix}${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore cached browsers
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.playwright.outputs.key }}

    # The runner's apt mirror has stalled for over 20 minutes on the ~150 OS
    # packages, so apt keeps their downloads in a cache saved per image and
    # restored from any image; apt downloads only the packages that differ.
    - name: Keep downloaded OS packages
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.cache/playwright-apt/partial
        printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/.cache/playwright-apt" |
          sudo tee /etc/apt/apt.conf.d/99-playwright-apt-cache >/dev/null

    - name: Restore cached OS packages
      id: restore-apt
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-apt/*.deb
        key: ${{ steps.playwright.outputs.apt-key }}
        restore-keys: ${{ steps.playwright.outputs.apt-prefix }}

    # Restored OS packages install through dpkg, without the mirror, whose
    # index update alone has stalled for over 9 minutes. Each package is
    # installed at its newest restored version unless the image already has
    # that version or a newer one. Playwright then fetches only browsers; if
    # dpkg fails, or nothing was restored, Playwright installs the packages
    # through apt. On a browser cache hit the browsers are present.
    # A miss downloads from the Playwright CDN; that download is the only
    # step retried, and every retry is recorded as a warning on the run.
    # An attempt that outlives its limit is a stalled mirror: it fails the
    # job at once with that reason instead of running into the job timeout.
    - name: Install browsers and OS packages
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        INSTALL_LIMIT_MINUTES: "10"
      run: |
        set -uo pipefail
        deps=--with-deps
        restored=0
        declare -A chosen=()
        # shellcheck disable=SC2016 # dpkg expands these fields.
        for deb in "$HOME"/.cache/playwright-apt/*.deb; do
          [ -e "$deb" ] || continue
          restored=$((restored + 1))
          read -r name version < <(dpkg-deb -W --showformat='${Package} ${Version}\n' "$deb")
          read -r state installed < <(dpkg-query -W --showformat='${db:Status-Status} ${Version}\n' "$name" 2>/dev/null || echo "absent -")
          if [ "$state" = installed ] && dpkg --compare-versions "$installed" ge "$version"; then continue; fi
          if [ -n "${chosen[$name]:-}" ] && dpkg --compare-versions "$(dpkg-deb -f "${chosen[$name]}" Version)" ge "$version"; then continue; fi
          chosen[$name]=$deb
        done
        if [ "$restored" -gt 0 ]; then
          if [ "${#chosen[@]}" -eq 0 ] || timeout --kill-after=30s "${INSTALL_LIMIT_MINUTES}m" \
            sudo dpkg -i "${chosen[@]}" >/dev/null; then
            deps=
          else
            echo "::warning title=Infrastructure retry::Installing the restored OS packages failed; installing them through apt"
          fi
        fi
        for attempt in 1 2 3; do
          # The runner starts bash with -e; "|| status=$?" keeps a failed
          # attempt from ending the step before it is reported or retried.
          status=0
          # shellcheck disable=SC2086 # deps and BROWSERS are word lists.
          timeout --kill-after=30s "${INSTALL_LIMIT_MINUTES}m" \
            bun run --cwd apps/os playwright install $deps --only-shell $BROWSERS || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error title=Playwright install stalled::Installing $BROWSERS and its OS packages took over $INSTALL_LIMIT_MINUTES minutes (attempt $attempt); the apt mirror or Playwright CDN stalled"
            exit 1
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "::warning title=Infrastructure retry::Playwright browser install failed (attempt $attempt of 3); retrying"
            echo "- Infrastructure retry: Playwright browser install failed (attempt $attempt of 3)" >> "$GITHUB_STEP_SUMMARY"
            sleep $((attempt * 10))
          fi
        done
        exit 1

    - name: Save browsers to the cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.playwright.outputs.key }}

    # A cache restored from another image can hold versions this image did
    # not install; only the installed versions are saved, so dpkg can
    # install the saved set on its own.
    - name: Keep only the installed OS package versions
      if: steps.restore-apt.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck disable=SC2016 # dpkg expands these fields.
        for deb in "$HOME"/.cache/playwright-apt/*.deb; do
          [ -e "$deb" ] || continue
          read -r name version < <(dpkg-deb -W --showformat='${Package} ${Version}\n' "$deb")
          installed="$(dpkg-query -W --showformat='${Version}' "$name" 2>/dev/null || true)"
          if [ "$installed" != "$version" ]; then rm -f "$deb"; fi
        done

    - name: Save OS packages to the cache
      if: steps.restore-apt.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-apt/*.deb
        key: ${{ steps.playwright.outputs.apt-key }}
