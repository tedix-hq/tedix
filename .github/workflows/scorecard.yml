name: OpenSSF Scorecard

# Supply-chain posture of the repository itself: pinned actions, token
# permissions, branch protection, dangerous workflow patterns, dependency
# update tooling. Results go to Security > Code scanning next to CodeQL and
# OSV-Scanner; findings do not fail the run.
on:
  push:
    branches:
      - main
    paths:
      - .github/**
      - package.json
      - bun.lock
      - SECURITY.md
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      # Needed to publish results to the public Scorecard API and badge.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
