name: Full suite hourly

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Sustained pushes must not starve certification of earlier main commits.
  group: main-certification-${{ github.event_name }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  plan:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      matrix: ${{ steps.plan.outputs.matrix }}
      runners: ${{ steps.plan.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_SUITE_RUNNER_LABELS: ${{ vars.FULL_SUITE_RUNNER_LABELS }}
        run: node scripts/ci/full-suite-hourly.mjs

  workspace:
    name: Workspace ${{ matrix.workspace }}${{ matrix.testScript && format(' / {0}', matrix.testScript) || '' }}${{ matrix.shard && format(' [{0}]', matrix.shard) || '' }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runners) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # The duration identifies a slow runner for the infrastructure rerun.
      - name: Frozen install
        run: |
          started=$SECONDS
          bun install --frozen-lockfile --ignore-scripts
          echo "FROZEN_INSTALL_SECONDS=$((SECONDS - started))" >> "$GITHUB_ENV"
      - name: Install ripgrep
        if: matrix.workspace == 'apps/tedi-runtime'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      # The plan derives each script's browsers from the specs it runs.
      - name: Install Playwright browsers
        if: matrix.browsers
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.browsers }}
      - name: Full test suite
        if: matrix.test
        env:
          WORKSPACE: ${{ matrix.workspace }}
          TEST_SCRIPT: ${{ matrix.testScript }}
          TEST_SHARD: ${{ matrix.shard }}
          BROWSERS: ${{ matrix.browsers }}
        run: |
          script="${TEST_SCRIPT:-$(node -e 'const p=require("./"+process.env.WORKSPACE+"/package.json"); console.log(p.scripts["test:ci"] ? "test:ci" : "test:run")')}"
          command=(bun run --cwd "$WORKSPACE" "$script")
          if [ -n "$TEST_SHARD" ]; then command+=(--shard "$TEST_SHARD"); fi
          # Browser suites get one recorded rerun, only for an infrastructure failure.
          if [ -n "$BROWSERS" ]; then
            node scripts/ci/rerun-on-infrastructure.mjs -- "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Type-check
        if: ${{ !cancelled() && matrix.types }}
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: bun run --cwd "$WORKSPACE" type-check

  repository:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runners) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Local onboarding smoke
        run: bun run-local --smoke --no-install
      - run: bun run test:scripts
      - if: ${{ !cancelled() }}
        run: bun run type-check:scripts
      - if: ${{ !cancelled() }}
        run: bun run docs:public:check

      - if: ${{ !cancelled() }}
        run: bun run verify --all --ci-policy
      - name: Require shellcheck
        run: command -v shellcheck
      - name: Lint workflows with shellcheck
        uses: ./.github/actions/actionlint

  aggregate:
    name: Main CI
    needs: [plan, workspace, repository]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          WORKSPACE: ${{ needs.workspace.result }}
          REPOSITORY: ${{ needs.repository.result }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" != true ]; then
            test "$WORKSPACE" = success
            test "$REPOSITORY" = success
          fi
