name: Workflow Sanity

on:
  pull_request:
    paths:
      - ".github/**"
      - "scripts/ci/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "scripts/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-sanity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Lint GitHub workflow definitions
        uses: ./.github/actions/actionlint

      - name: Check workflow safety invariants
        run: node scripts/oss/workflow-sanity.mjs
