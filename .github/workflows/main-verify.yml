name: Workspace types after push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Coalesce waiting pushes; never cancel a running verify.
  group: main-verify
  cancel-in-progress: false

env:
  CI: "true"
  BUN_VERSION: "1.4.5"

jobs:
  plan:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspace: ${{ steps.plan.outputs.workspace }}
      matrix: ${{ steps.plan.outputs.matrix }}
      runners: ${{ steps.plan.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_SUITE_RUNNER_LABELS: ${{ vars.FULL_SUITE_RUNNER_LABELS }}
          SUITE_LANE: verify
        run: node scripts/ci/full-suite-hourly.mjs

  workspace:
    name: Types ${{ matrix.workspace }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.workspace == 'true' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runners) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Every shard resolves the same dependency set, so the lockfile-keyed
      # global cache lets a shard reuse another shard's download. The prefix
      # key restores an older lockfile's cache on a miss; entries are per
      # version and `bun install` verifies each one against the lockfile, so
      # only compatible packages are reused.
      - name: Share the frozen dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Provide the Vite+ package manager
        uses: ./.github/actions/vite-plus-package-manager
      - name: Type-check
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: bun run --cwd "$WORKSPACE" type-check

  aggregate:
    name: Main verify
    needs: [plan, workspace]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected shard
        env:
          PLAN: ${{ needs.plan.result }}
          WORKSPACE_REQUIRED: ${{ needs.plan.outputs.workspace }}
          WORKSPACE: ${{ needs.workspace.result }}
        run: |
          test "$PLAN" = success
          if [ "$WORKSPACE_REQUIRED" = true ]; then
            test "$WORKSPACE" = success
          else
            test "$WORKSPACE_REQUIRED" = false
            test "$WORKSPACE" = skipped
          fi
