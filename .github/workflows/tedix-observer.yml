name: Repository observer

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".changeset/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: repository-observer-${{ github.sha }}
  cancel-in-progress: true

jobs:
  notify:
    if: vars.TEDIX_OBSERVER_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Wake the configured observer
        env:
          TEDIX_OBSERVER_URL: ${{ vars.TEDIX_OBSERVER_URL }}
        run: node scripts/ci/notify-repository-observer.mjs
