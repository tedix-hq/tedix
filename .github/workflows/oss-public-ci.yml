name: OSS Public CI

on:
  # Main pushes are certified by full-suite-hourly.yml. Contributor and
  # release checks stay here; automatic jobs skip private repositories.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
  workflow_call:
    inputs:
      force_full:
        description: Run full certification even when the caller is a tag push
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-public-ci-${{ github.event_name }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request') && github.run_id || github.ref }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  verify:
    name: Contributor verify
    concurrency:
      group: oss-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # The same change-scoped gates the pre-push hook runs.
    if: >-
      github.event.repository.private == false &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Frozen install
        run: bun install --frozen-lockfile --ignore-scripts

      # The tedi computer's code-search tests run rg whenever tedi-runtime or a
      # package it depends on changes.
      - name: Install ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep

      # OS test:run includes real-browser checks, including in this scoped lane.
      - name: Install Playwright Chromium
        run: bun run --cwd apps/os test:browser:install

      - name: Verify the pushed or proposed range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run verify --base "$BASE_SHA" --head "$GITHUB_SHA"

      # Script-only package changes are not selected by vitest related.
      - name: Test OS when its test setup changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- .github/workflows/oss-public-ci.yml apps/os/package.json; then
            bun run --cwd apps/os test:run
          fi

      - name: Retain full failed gate logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contributor-verify-logs
          path: /tmp/pre-push-*/*.log
          if-no-files-found: ignore
          retention-days: 3

  policy:
    name: Public policy and architecture
    if: >-
      (inputs.force_full == true || github.event_name != 'push') &&
      (github.event_name != 'pull_request' ||
      github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Frozen install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate workflows
        run: node scripts/oss/workflow-sanity.mjs

      - name: Lint workflow definitions
        uses: ./.github/actions/actionlint

      - name: Check workspace license map and dependency licenses
        run: bun run oss:check

      - name: Check installation manifest contract
        run: bun run installation-manifest:check

      - name: Check generated secret-free Wrangler overlay
        run: bun run installation-manifest:overlay:check

      - name: Test OSS scripts
        run: bun run test:scripts

      - name: Scan for secrets
        run: bun run scan:secrets

      - name: Check public documentation
        run: bun run docs:public:check

      - name: Check dependency consistency
        run: bun run lint:deps

      - name: Check architecture and policy invariants
        run: bun run lint:repo

  types:
    name: Generated and workspace types
    if: >-
      (inputs.force_full == true || github.event_name != 'push') &&
      (github.event_name != 'pull_request' ||
      github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Frozen install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check generated Worker types
        run: bun run types:check

      - name: Type-check public workspaces
        run: bun run type-check

  tests:
    name: Workspace tests
    if: >-
      (inputs.force_full == true || github.event_name != 'push') &&
      (github.event_name != 'pull_request' ||
      github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Frozen install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: bun run --cwd apps/os test:browser:install

      # The tedi computer's code search runs ripgrep; its tests execute it.
      - name: Install ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep

      - name: Test public workspaces
        run: bun run test:ci

  build:
    name: Workspace builds
    if: >-
      (inputs.force_full == true || github.event_name != 'push') &&
      (github.event_name != 'pull_request' ||
      github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Frozen install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build public workspaces
        env:
          TEDIX_BUILD_API_URL: https://api.example.test
          TEDIX_BUILD_DESCOPE_PROJECT_ID: public-ci-placeholder
          TEDIX_BUILD_DESCOPE_BASE_URL: https://auth.example.test
          TEDIX_BUILD_OS_URL: https://os.example.test
          TEDIX_BUILD_SESSION_BROKER_URL: https://auth.example.test
        run: bun run build
