name: OSS Public CI

on:
  # `verify` runs on every push to main and every pull request. The heavier
  # jobs run on pull requests, the release lane (workflow_call) and dispatch.
  # Automatic runs are skipped in a private repository.
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      force_full:
        description: Run full certification even when the caller is a tag push
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-public-ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  verify:
    name: Contributor verify
    # The same change-scoped gates the pre-push hook runs.
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Frozen install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify the pushed or proposed range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run verify --base "$BASE_SHA" --head "$GITHUB_SHA"

  policy:
    name: Public policy and architecture
    if: >-
      (inputs.force_full == true || github.event_name != 'push') &&
      (github.event_name != 'pull_request' ||
      github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Frozen install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate workflows
        run: node scripts/oss/workflow-sanity.mjs

      - name: Lint workflow definitions
        uses: ./.github/actions/actionlint

      - name: Check licenses, provenance and workspace license map
        run: bun run oss:check

      - name: Check installation manifest contract
        run: bun run installation-manifest:check

      - name: Check generated secret-free Wrangler overlay
        run: bun run installation-manifest:overlay:check

      - name: Test OSS scripts
        run: bun run test:scripts

      - name: Generate and verify release evidence
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          bun scripts/oss/release-evidence.ts --out "$RUNNER_TEMP/evidence" --ref "$GITHUB_SHA"
          (cd "$RUNNER_TEMP/evidence" && sha256sum --check --strict checksums.txt)

      - name: Scan for secrets
        run: bun run scan:secrets

      - name: Check public documentation
        run: bun run docs:public:check

      - name: Check dependency consistency
        run: bun run lint:deps

      - name: Check architecture and policy invariants
        run: |
          set -euo pipefail
          bun scripts/check-package-boundaries.ts
          bun scripts/check-package-exports.ts
          bun scripts/lint-wrangler.ts --strict
          bun scripts/lint-db-access.ts
          bun scripts/lint-d1.ts
          bun scripts/lint-authz.ts --strict
          bun scripts/lint-contracts.ts

  types:
    name: Generated and workspace types
    if: >-
      (inputs.force_full == true || github.event_name != 'push') &&
      (github.event_name != 'pull_request' ||
      github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Frozen install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check generated Worker types
        run: bun run types:check

      - name: Type-check public workspaces
        run: bun run type-check

  tests:
    name: Workspace tests
    if: >-
      (inputs.force_full == true || github.event_name != 'push') &&
      (github.event_name != 'pull_request' ||
      github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Frozen install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test public workspaces
        run: bun run test:ci

  build:
    name: Workspace builds
    if: >-
      (inputs.force_full == true || github.event_name != 'push') &&
      (github.event_name != 'pull_request' ||
      github.event.repository.private == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Frozen install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build public workspaces
        env:
          TEDIX_BUILD_API_URL: https://api.example.test
          TEDIX_BUILD_DESCOPE_PROJECT_ID: public-ci-placeholder
          TEDIX_BUILD_DESCOPE_BASE_URL: https://auth.example.test
          TEDIX_BUILD_OS_URL: https://os.example.test
          TEDIX_BUILD_SESSION_BROKER_URL: https://auth.example.test
        run: bun run build
