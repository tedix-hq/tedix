name: Verify and build Tedix CLI from public source

# Managed publication belongs to the guarded private operations publisher.
# This workflow needs no Cloudflare credentials or live installation values.

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'tedix-hq/tedix' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-bun downloads bun from github.com/.../releases/download; a
      # release-file outage failed every cli-v0.20.0 attempt. The pinned bun
      # ships on npm, which `bun install` below already depends on, so this
      # adds no new failure domain.
      - name: Install the pinned Bun from npm
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").packageManager.match(/^bun@(.+)$/)[1]')"
          prefix="${RUNNER_TEMP}/bun-npm"
          for attempt in 1 2 3; do
            if npm install --prefix "$prefix" --ignore-scripts --no-save --no-audit --no-fund "@oven/bun-linux-x64@${version}"; then
              break
            fi
            echo "::warning title=Infrastructure retry::Bun npm install failed (attempt $attempt of 3); retrying"
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          bin_dir="${prefix}/node_modules/@oven/bun-linux-x64/bin"
          test -x "${bin_dir}/bun"
          ln -sf "${bin_dir}/bun" "${bin_dir}/bunx"
          echo "$bin_dir" >> "$GITHUB_PATH"
          # GITHUB_PATH applies from the next step, so check the binary itself.
          test "$("${bin_dir}/bun" --version)" = "$version"
      - run: bun install --frozen-lockfile
      - name: Validate release version
        run: |
          VERSION=$(bun -e 'console.log(require("./packages/cli/package.json").version)')
          test "${GITHUB_REF_NAME}" = "cli-v${VERSION}"
      - run: bun run --cwd packages/cli test:run
      - run: bun run --cwd packages/cli type-check
      - run: bun run --cwd packages/cli test:protocol
      - run: bun run --cwd packages/cli test:standalone
      - run: bun run --cwd packages/cli test:installer

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-arm64
          - bun-linux-x64
          - bun-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Bun from npm
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").packageManager.match(/^bun@(.+)$/)[1]')"
          prefix="${RUNNER_TEMP}/bun-npm"
          for attempt in 1 2 3; do
            if npm install --prefix "$prefix" --ignore-scripts --no-save --no-audit --no-fund "@oven/bun-linux-x64@${version}"; then
              break
            fi
            echo "::warning title=Infrastructure retry::Bun npm install failed (attempt $attempt of 3); retrying"
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          bin_dir="${prefix}/node_modules/@oven/bun-linux-x64/bin"
          test -x "${bin_dir}/bun"
          ln -sf "${bin_dir}/bun" "${bin_dir}/bunx"
          echo "$bin_dir" >> "$GITHUB_PATH"
          # GITHUB_PATH applies from the next step, so check the binary itself.
          test "$("${bin_dir}/bun" --version)" = "$version"
      - run: bun install --frozen-lockfile
      - name: Validate release version
        run: |
          VERSION=$(bun -e 'console.log(require("./packages/cli/package.json").version)')
          test "${GITHUB_REF_NAME}" = "cli-v${VERSION}"
      - run: bun run --cwd packages/cli build:standalone ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tedix-${{ matrix.target }}
          path: packages/cli/dist/tedix-*

  # Checksums and a build-provenance attestation for every binary, so a
  # download can be verified with `sha256sum --check SHA256SUMS` and
  # `gh attestation verify <file> --repo tedix-hq/tedix`.
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tedix-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum tedix-* > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tedix-cli-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
