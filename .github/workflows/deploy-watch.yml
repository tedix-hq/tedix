name: Watch for a newly live commit

# Reads the deployed commit from api/os/builder health and dispatches
# hosted-suite.yml once per live commit. Ship is never waited on or called:
# this only observes what production already reports.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-watch
  cancel-in-progress: false

jobs:
  watch:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_URLS: https://api.tedix.dev/health https://os.tedix.dev/health https://builder.tedix.dev/health
        run: node scripts/ci/hosted-suite.mjs watch
