name: OSS Release Evidence

on:
  push:
    tags:
      # Stable tags only; a prerelease tag (v0.1.0-beta.1) is not a stable release.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  certify-public-source:
    uses: ./.github/workflows/oss-public-ci.yml
    with:
      force_full: true

  release-evidence:
    needs: certify-public-source
    # Attestation is unaffected by the runner class: it is minted from the job's
    # OIDC token, which self-hosted runners request the same way. `no-cache` on
    # setup-bun below still matters — the point is that nothing this job runs
    # comes from a cache a lower-privileged workflow could have written.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate stable release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match v<major>.<minor>.<patch>"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # release notes need tag-to-tag history
          fetch-tags: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
          # This job attests the artifacts it builds, so nothing it runs may come
          # from a cache a lower-privileged workflow could have written. Costs one
          # bun-binary download per tag push.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Require dependency-license release readiness
        run: bun scripts/oss/dependency-license-policy.ts

      - name: Generate release evidence
        run: bun scripts/oss/release-evidence.ts --out "$RUNNER_TEMP/oss-evidence" --ref "$GITHUB_SHA"

      - name: Verify release evidence checksums
        working-directory: ${{ runner.temp }}/oss-evidence
        run: sha256sum --check --strict checksums.txt

      - name: Generate release notes
        run: |
          bun run release:notes -- \
            --to "$GITHUB_SHA" \
            --version "$GITHUB_REF_NAME" \
            --out "$RUNNER_TEMP/oss-evidence/RELEASE_NOTES.md"

      - name: Attest release evidence
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/oss-evidence/*

      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oss-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/oss-evidence/*
          if-no-files-found: error
