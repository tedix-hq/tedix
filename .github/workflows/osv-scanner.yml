name: OSV-Scanner

# Known-vulnerability scan of bun.lock (OSV-Scanner reads it natively). Results
# go to Security > Code scanning next to CodeQL; findings do not fail the run.
on:
  push:
    branches:
      - main
    paths:
      - bun.lock
      - .github/workflows/osv-scanner.yml
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exits 1 when vulnerabilities are found; the SARIF check below still
      # fails the job when the scan itself broke and wrote nothing.
      - name: Scan bun.lock
        id: scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=bun.lock
            --format=sarif
            --output-file=results.sarif

      - name: Check that the scan wrote results
        run: test -s results.sarif

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: osv-scanner
