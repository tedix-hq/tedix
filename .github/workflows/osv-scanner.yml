name: OSV-Scanner

# Known-vulnerability scan of every bun.lock: the workspace and the six CMS
# template scaffolds tenant sites are built from (OSV-Scanner reads them
# natively). Results go to Security > Code scanning next to CodeQL; findings
# do not fail the run.
on:
  push:
    branches:
      - main
    paths:
      - bun.lock
      - apps/cms/templates/*/bun.lock
      - .github/workflows/osv-scanner.yml
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exits 1 when vulnerabilities are found; the SARIF check below still
      # fails the job when the scan itself broke and wrote nothing.
      - name: Scan every bun.lock
        id: scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=bun.lock
            --lockfile=apps/cms/templates/blog/bun.lock
            --lockfile=apps/cms/templates/marketing/bun.lock
            --lockfile=apps/cms/templates/native-marketing/bun.lock
            --lockfile=apps/cms/templates/portfolio/bun.lock
            --lockfile=apps/cms/templates/starter/bun.lock
            --lockfile=apps/cms/templates/tedix/bun.lock
            --format=sarif
            --output-file=results.sarif

      - name: Check that the scan wrote results
        run: test -s results.sarif

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: osv-scanner
